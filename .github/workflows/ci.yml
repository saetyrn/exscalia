name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The full-lifespan smoke test asserts the built SPA actually serves,
      # so the backend job needs a real frontend build, not a stub.
      - name: Build frontend
        run: npm ci --prefix frontend && npm run build --prefix frontend

      - name: Run backend tests
        working-directory: backend
        # pytest lives in the `dev` extra, not the base dependencies.
        run: uv run --extra dev pytest -q -o faulthandler_timeout=60

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install deps
        run: npm ci --prefix frontend

      - name: Unit tests
        run: npm test --prefix frontend

      - name: Build
        run: npm run build --prefix frontend

      - name: Type check
        run: npm run check --prefix frontend
