[project]
name = "omnianote"
version = "0.1.0"
description = "Self-hosted markdown notebook with an AI overseer"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "gitpython>=3.1",
    "python-frontmatter>=1.1",
    "pydantic-settings>=2.4",
    "aiosqlite>=0.20",
    "itsdangerous>=2.2",
    "anthropic>=0.40",
    "openai>=1.50",
    "google-genai>=1.0",
    "lancedb>=0.15",
    "fastembed>=0.4",
    "pillow>=12.3.0",
    "pypdf>=6.14.2",
    # Media metadata lookups + cover downloads (was only a transitive of the
    # AI SDKs before; the media tracker depends on it directly).
    "httpx>=0.27",
    "pywebpush>=2.4.0",
    "py-vapid>=1.9.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
