[project]
name = "omnianote"
version = "0.1.0"
description = "Self-hosted markdown notebook with an AI overseer"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.30",
    "gitpython>=3.1",
    "python-frontmatter>=1.1",
    "pydantic-settings>=2.4",
    "aiosqlite>=0.20",
    "itsdangerous>=2.2",
    "anthropic>=0.40",
    "openai>=1.50",
    "google-genai>=1.0",
    "lancedb>=0.15",
    "fastembed>=0.4",
    "pillow>=12.3.0",
    "pypdf>=6.14.2",
    "python-docx>=1.1",
    # Media metadata lookups + cover downloads (was only a transitive of the
    # AI SDKs before; the media tracker depends on it directly).
    "httpx>=0.27",
    "pywebpush>=2.4.0",
    "py-vapid>=1.9.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

# Lint and type gates run through `uvx` (see .github/workflows/ci.yml), so
# neither ruff nor pyright is a project dependency.
[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F", "B", "ASYNC"]
# B904/B905 are bugbear's opinionated checks (off by default upstream):
# 26 `raise HTTPException` sites without `from`, 3 zip() without `strict=`.
# ASYNC109 (a coroutine taking `timeout=`) is a deliberate signature here:
# the vault's final push and test fakes shaped like httpx.
ignore = ["E501", "B904", "B905", "ASYNC109"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's parameter markers are declarations, not shared mutable defaults.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Depends",
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
    "fastapi.Security",
]

[tool.ruff.lint.per-file-ignores]
# Tests poll with short sleeps on purpose. The unused imports/locals in tests
# are cleanup for after the audit wave, when fewer branches edit them.
"tests/**" = ["ASYNC110", "F401", "F541", "F841"]

[tool.pyright]
# The data-safety core first; widen as the rest gains annotations.
include = ["app/vault", "app/index", "app/task_service.py", "app/pending"]
typeCheckingMode = "basic"
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
